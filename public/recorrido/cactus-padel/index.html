<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Recorrido TurnitosLR · Cactus Pádel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap">
<style>
/* Layout: la app a pantalla completa. Primero se ve la pantalla limpia; después se oscurece alrededor de la función
   y aparecen el texto y las flechas en el espacio libre. En compu, el texto grande va al costado del celular. */
:root{
  --tl:#3ECF8E; --ink:#0E1411; --night:#080B0A; --app:#F4F6F5;
  --white:#FFFFFF; --paper:#F1F3F0; --tld:#14805A; --mist:#B9C6BF; --shade:rgba(6,9,8,.8);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.65,0,.25,1); --pop:cubic-bezier(.2,1.25,.35,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--white);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;aspect-ratio:1;filter:blur(60px);animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:90%;left:-30%;top:-14%;background:#B9EED3}
.blobs i:nth-child(2){width:80%;right:-36%;top:24%;background:#F7DCCD;animation-duration:29s;animation-direction:alternate-reverse}
.blobs i:nth-child(3){width:70%;left:8%;bottom:-28%;background:#DCF5E8;animation-duration:25s}
#bg i{filter:blur(120px);opacity:.85}
#bg i:nth-child(1){width:46%}#bg i:nth-child(2){width:40%;right:-8%;top:30%}#bg i:nth-child(3){width:36%;left:30%}
@keyframes drift{to{transform:translate(12%,9%) scale(1.16)}}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:72px}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--night);isolation:isolate}
.screen{position:absolute;inset:0;overflow:hidden}

/* escenas */
.scene{position:absolute;inset:0;overflow:hidden;background:var(--app);will-change:transform}
.shot{position:absolute;left:0;top:0;width:100%;transition:transform 1.1s var(--ease)}
.shot img{display:block;width:100%;height:auto}
.scene.in-next{animation:inNext .75s var(--ease) both}
.scene.out-next{animation:outNext .75s var(--ease) both}
.scene.in-prev{animation:inPrev .75s var(--ease) both}
.scene.out-prev{animation:outPrev .75s var(--ease) both}
@keyframes inNext{from{transform:translateX(100%)}}
@keyframes outNext{to{transform:translateX(-30%) scale(.94);filter:brightness(.25)}}
@keyframes inPrev{from{transform:translateX(-30%) scale(.94);filter:brightness(.25)}}
@keyframes outPrev{to{transform:translateX(100%)}}
.scene.in-cover{animation:inCover .95s var(--ease) both}
@keyframes inCover{from{clip-path:circle(0% at var(--cx,50%) var(--cy,60%))}to{clip-path:circle(150% at var(--cx,50%) var(--cy,60%))}}

/* foco: oscurece todo menos la función */
.spot{position:absolute;z-index:2;border-radius:16px;box-shadow:0 0 0 2px rgba(62,207,142,0),0 0 0 9999px rgba(6,9,8,0);transition:box-shadow .7s ease,top .9s var(--ease),left .9s var(--ease),width .9s var(--ease),height .9s var(--ease),border-radius .6s;pointer-events:none}
.scene.focus .spot{box-shadow:0 0 0 2px var(--tl),0 0 0 9999px var(--shade)}
.spot::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--tl);opacity:0}
.scene.focus .spot::after{animation:halo 2.2s 1.2s ease-out infinite}
@keyframes halo{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.scene.full .spot{box-shadow:none}
.scene.full .spot::after{display:none}
.botscrim{position:absolute;inset:auto 0 0 0;height:52%;z-index:2;background:linear-gradient(180deg,rgba(6,9,8,0),rgba(6,9,8,.92) 55%);opacity:0;transition:opacity .7s}
.scene.full.focus .botscrim{opacity:1}

/* texto */
.copy{position:absolute;z-index:4;left:22px;right:22px;pointer-events:none}
.copy .tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tl);margin-bottom:9px}
.copy .tag i{width:7px;height:7px;border-radius:50%;background:var(--tl);box-shadow:0 0 12px var(--tl)}
.copy .tag.hid{color:var(--ink);background:var(--tl);border-radius:999px;padding:5px 10px 5px 8px;letter-spacing:.06em}
.copy .tag.hid i{background:var(--ink);box-shadow:none}
.copy h2{margin:0;font-size:clamp(29px,8.4vw,40px);line-height:1.03;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.copy h2 em,.cover h1 em{font-style:italic;color:var(--tl)}
.copy p{margin:10px 0 0;font-size:16px;line-height:1.45;color:#DCE5E0;max-width:32ch}
.copy .where{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--mist);border-left:2px solid var(--tl);padding-left:9px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .1em .1em 0;margin:0 -.1em -.1em 0}
.w>span{display:inline-block;transform:translateY(108%)}
.show .w>span{animation:wordUp .7s var(--ease) forwards}
@keyframes wordUp{to{transform:translateY(0)}}
.rise{opacity:0;transform:translateY(12px)}
.show .rise{animation:rise .6s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.copy.leave,.notes.leave{animation:leave .3s ease forwards}
@keyframes leave{to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}

/* flechas con texto */
.notes{position:absolute;inset:0;z-index:3;pointer-events:none}
.notes svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.notes path{fill:none;stroke:var(--tl);stroke-width:2;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.notes circle{fill:var(--tl);opacity:0;transform-box:fill-box;transform-origin:center}
.notes.show path{animation:draw .55s var(--ease) forwards}
.notes.show circle{animation:dot .4s var(--pop) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.lbl{position:absolute;white-space:nowrap;font-size:13px;font-weight:800;color:var(--ink);background:var(--tl);border-radius:999px;padding:6px 11px;opacity:0;transform:scale(.8)}
.notes.show .lbl{animation:lbl .45s var(--pop) forwards}
@keyframes lbl{to{opacity:1;transform:none}}
.tap{position:absolute;z-index:3;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;pointer-events:none}
.scene.focus .tap{animation:tap 2.4s 1.4s ease-in-out infinite}
@keyframes tap{0%{opacity:0;transform:scale(1.5)}14%{opacity:1;transform:scale(1)}24%{transform:scale(.82)}40%{transform:scale(1)}62%{opacity:1}78%,100%{opacity:0}}

/* efectos especiales */
.ring{position:absolute;z-index:3;border-radius:50%;background:conic-gradient(from 0deg,#F9CE34,#EE2A7B,#6228D7,#F9CE34);-webkit-mask:radial-gradient(circle,transparent 61%,#000 62.5%);mask:radial-gradient(circle,transparent 61%,#000 62.5%);opacity:0}
.scene.focus .ring{animation:spin 3.2s linear infinite,ringIn .9s .3s var(--pop) forwards}
@keyframes spin{to{rotate:360deg}}
@keyframes ringIn{from{scale:.3;opacity:0}to{opacity:1}}
.browser{position:absolute;left:12px;right:12px;z-index:3;background:rgba(255,255,255,.98);color:#16201B;border-radius:16px;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:9px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:dropIn .8s .2s var(--pop) both}
.browser b{font-weight:800}
.browser .typed{white-space:nowrap;overflow:hidden;min-width:0}
.browser .lk{width:18px;height:18px;border-radius:50%;background:var(--tl);flex:none;display:grid;place-items:center;color:var(--ink);font-size:10px;font-weight:800}
.caret{display:inline-block;width:2px;height:17px;background:#16201B;margin-left:1px;animation:blink .8s steps(2) infinite;vertical-align:-3px}
@keyframes blink{50%{opacity:0}}

/* Transición reserva → panel: pantalla bloqueada, corte de música, notificación con sonido y vibración */
.scene.lock.in-next,.scene.lock.in-prev{animation:lkFade .35s ease both}
@keyframes lkFade{from{opacity:0}to{opacity:1}}
.scene.lock{background:radial-gradient(120% 80% at 50% 0%,#12332a 0%,#071510 45%,#020604 100%);color:#fff;overflow:hidden}
.lock .lk-time{position:absolute;left:0;right:0;top:calc(96px + env(safe-area-inset-top,0px));text-align:center;font-weight:700;font-size:clamp(64px,24cqw,92px);letter-spacing:-.04em;line-height:1}
.lock .lk-date{position:absolute;left:0;right:0;top:calc(196px + env(safe-area-inset-top,0px));text-align:center;font-weight:600;font-size:15px;color:rgba(255,255,255,.75)}
.lock .lk-glow{position:absolute;inset:auto -20% -30% -20%;height:60%;background:radial-gradient(closest-side,rgba(62,207,142,.28),transparent);filter:blur(10px);opacity:.0;transition:opacity 1.2s}
.lock.nt-on .lk-glow{opacity:1}
.lock .notif{position:absolute;left:12px;right:12px;top:calc(250px + env(safe-area-inset-top,0px));background:rgba(245,248,246,.97);color:#0E1411;border-radius:22px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 22px 60px rgba(0,0,0,.55);transform:translateY(-140%) scale(.92);opacity:0}
.lock.nt-on .notif{animation:ntIn .75s var(--pop) forwards}
.lock .notif img{width:38px;height:38px;border-radius:10px;flex:none}
.lock .notif .nt-h{display:flex;justify-content:space-between;font-size:11.5px;color:#5b6862;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.lock .notif b{display:block;font-size:15px;margin:3px 0 2px}
.lock .notif .nt-b{font-size:13.5px;line-height:1.35;color:#25302b}
.lock .notif .nt-b small{color:#5b6862}
.lock .lk-hint{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);opacity:0}
.lock.nt-on .lk-hint{animation:lkIn .6s 1.1s var(--ease) forwards}
.lock .lk-app{position:absolute;z-index:4;background:#F5F7F6;border-radius:22px;transition:all .6s var(--ease)}
.lock.nt-open .notif{transition:opacity .25s;opacity:0}
.lock.nt-open .lk-time,.lock.nt-open .lk-date{transition:opacity .4s;opacity:0}
.lock .tapdot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(62,207,142,.35);border:3px solid #3ECF8E;opacity:0;pointer-events:none}
.lock.nt-tap .tapdot{animation:tapIt .7s ease-out forwards}
@keyframes lkIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ntIn{from{transform:translateY(-140%) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes tapIt{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.4)}}
@keyframes buzz{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px) rotate(-.6deg)}30%{transform:translateX(5px) rotate(.6deg)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.device.buzz{animation:buzz .45s linear 2}
@keyframes dropIn{from{transform:translateY(-30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.push{position:absolute;left:12px;right:12px;z-index:3;background:rgba(246,248,247,.98);color:#16201B;border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 50px rgba(0,0,0,.5);font-size:13px;line-height:1.35;opacity:0}
.scene.focus .push{animation:dropIn .9s var(--pop) forwards}
.push img{width:40px;height:40px;border-radius:10px;flex:none}
.push small{color:#5F6E66}
.push .when{margin-left:auto;align-self:flex-start;font-size:11px;color:#7A8981}

/* secuencias animadas */
.frames{position:absolute;inset:0;background:var(--app)}
.frame{position:absolute;left:0;top:0;width:100%;opacity:0;transform:scale(1.02);transition:opacity .4s ease,transform .5s var(--ease)}
.frame.on{opacity:1;transform:none}
.frame img{display:block;width:100%;height:auto}
.press{position:absolute;z-index:3;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 0 rgba(62,207,142,.6);pointer-events:none;animation:press .75s ease-out forwards}
@keyframes press{0%{opacity:0;transform:scale(1.6)}35%{opacity:1;transform:scale(1)}55%{transform:scale(.78);box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 0 rgba(62,207,142,.6)}100%{opacity:0;transform:scale(1);box-shadow:0 6px 18px rgba(0,0,0,0),0 0 0 26px rgba(62,207,142,0)}}
.cap{position:absolute;z-index:4;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(8,11,10,.88);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:9px 16px 9px 9px;font-size:14px;font-weight:700;line-height:1.25;width:max-content;max-width:calc(100% - 28px);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .3s}
.cap b{flex:none;display:grid;place-items:center;min-width:26px;height:26px;border-radius:999px;background:var(--tl);color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums;padding:0 6px}
.cap span{display:inline-block;min-width:0;animation:capIn .4s var(--ease)}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}}
.scene.focus .cap{opacity:0}
.introdim{position:absolute;inset:0;z-index:3;background:rgba(6,9,8,.82);display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(150px + env(safe-area-inset-bottom,0px));transition:opacity .6s}
.introdim.off{opacity:0;pointer-events:none}
.introdim h2{margin:0;font-size:clamp(32px,9vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.025em}
.introdim h2 em{font-style:italic;color:var(--tl)}
.introdim p{margin:10px 0 0;font-size:16px;color:#DCE5E0;max-width:30ch}
.introdim .play{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--tl)}
.replay{position:absolute;z-index:5;right:14px;top:calc(64px + env(safe-area-inset-top,0px));border:0;border-radius:999px;background:rgba(8,11,10,.75);color:#fff;font:700 12.5px var(--font);padding:8px 12px;cursor:pointer;opacity:0;transition:opacity .4s}
.scene.done .replay{opacity:1}
.wa{width:100%;height:100%;background:#E9E2D9;display:flex;flex-direction:column;font-family:var(--font)}
.wa .hd{background:#075E54;color:#fff;padding:16px 14px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.wa .hd img{width:38px;height:38px;border-radius:50%}
.wa .hd small{display:block;font-weight:500;opacity:.8;font-size:12px}
.wa .body{flex:1;padding:18px 12px;display:flex;flex-direction:column;justify-content:flex-start}
.wa .msg{align-self:flex-end;max-width:84%;background:#DCF8C6;color:#111B21;border-radius:12px 2px 12px 12px;padding:9px 11px 18px;font-size:14px;line-height:1.42;white-space:pre-line;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:0;transform:translateY(14px)}
.frame.on .wa .msg{animation:msgIn .5s .5s var(--pop) forwards}
@keyframes msgIn{to{opacity:1;transform:none}}
.wa .msg small{position:absolute;right:9px;bottom:4px;font-size:10.5px;color:#667781}
.wa .bar{background:#F0F2F5;padding:10px 12px 14px;display:flex;gap:8px}
.wa .bar span{flex:1;background:#fff;border-radius:999px;padding:10px 14px;color:#8696A0;font-size:14px}

/* portadas */
.device{container-type:inline-size}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,7cqw,30px) calc(104px + env(safe-area-inset-bottom,0px));overflow:hidden}
.cover>*:not(.blobs):not(.num){position:relative}
.cover .hero{flex:1;min-height:0;display:flex;align-items:center;padding-top:calc(64px + env(safe-area-inset-top,0px))}
.kick{font-size:clamp(10.5px,3.1cqw,12.5px);font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.cover h1{font-size:clamp(30px,14cqw,64px);line-height:.95;margin:.25em 0 .3em;font-weight:800;letter-spacing:-.035em}
.cover h1 em{font-style:italic}
.cover p{margin:0;font-size:clamp(13.5px,4.3cqw,17px);line-height:1.45;max-width:28ch}
.cover .url{margin-top:clamp(14px,5cqw,22px);align-self:flex-start;border-radius:999px;padding:.7em 1.1em;font-weight:700;font-size:clamp(12px,3.7cqw,14.5px);white-space:nowrap}
@keyframes popIn{from{transform:scale(.5) rotate(-8deg);opacity:0}}
/* inicio: claro */
.cover.intro{background:var(--paper);color:var(--ink)}
.cover.intro .kick,.cover.intro h1 em{color:var(--tld)}
.cover.intro p{color:#4A5851}
.cover.intro .url{background:var(--ink);color:#fff}
.cover.intro .url b{color:var(--tl)}
.lg{position:relative;display:inline-block;line-height:0}
.lg img:first-child{width:clamp(84px,34cqw,150px);height:clamp(84px,34cqw,150px);border-radius:50%;box-shadow:0 18px 50px rgba(14,20,17,.18),0 0 0 6px #fff;animation:popIn .9s .25s var(--pop) both}
.lg .tl{position:absolute;right:-6%;bottom:-4%;width:32%;height:32%;border-radius:28%;box-shadow:0 6px 16px rgba(14,20,17,.25);animation:popIn .7s .65s var(--pop) both}
/* capítulos: verde pleno, número gigante */
.cover.ch{background:var(--tl);color:var(--ink)}
.cover.ch .num{position:absolute;right:clamp(14px,5cqw,24px);top:calc(58px + env(safe-area-inset-top,0px));font-size:clamp(140px,66cqw,300px);line-height:.82;font-weight:800;letter-spacing:-.07em;color:var(--ink);animation:numIn 1.1s .15s cubic-bezier(.2,1,.3,1) both,bob 7s 1.3s ease-in-out infinite alternate}
@keyframes numIn{from{opacity:0;transform:translateY(40px)}}
@keyframes bob{to{transform:translateY(-10px)}}
.cover.ch h1 em{color:var(--ink)}
.cover.ch .kick{opacity:.7}
.cover.ch p{color:rgba(14,20,17,.8)}
/* cierre: oscuro */
.cover.outro{background:var(--ink);color:#fff}
.cover.outro .kick,.cover.outro h1 em,.cover.outro .url b{color:var(--tl)}
.cover.outro p{color:var(--mist)}
.cover.outro .url{border:1px solid rgba(62,207,142,.4)}
.cover.outro .url.go{display:inline-flex;align-items:center;gap:.6em;background:var(--tl);color:var(--ink);border:0;text-decoration:none;padding:.95em 1.3em;box-shadow:0 10px 30px rgba(62,207,142,.35);cursor:pointer;position:relative;z-index:5}
.cover.outro .url.go b{color:var(--ink)}
.cover.outro .url.go .ar{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:var(--tl);font-size:.95em}
.cover.outro .url.go:active{transform:scale(.97)}
.chk{width:clamp(70px,26cqw,104px);aspect-ratio:1;border-radius:50%;background:var(--tl);color:var(--ink);display:grid;place-items:center;font-size:clamp(32px,12cqw,48px);font-weight:800;animation:popIn .9s .3s var(--pop) both,pulse 3s 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.45)}100%{box-shadow:0 0 0 34px rgba(62,207,142,0)}}
/* controles sobre fondo claro o verde */
.device.lt .bars i{background:rgba(14,20,17,.16);box-shadow:none}
.device.lt .bars i b{background:var(--ink)}
.device.lt .nav .hint{color:rgba(14,20,17,.7)}
.device.lt .nav button.go{background:var(--ink);color:#fff}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;gap:16px;align-items:baseline;font-size:28px;font-weight:800;letter-spacing:-.02em;color:rgba(14,20,17,.26);padding:10px 0;transition:color .4s}
.toc li span{font-size:13px;letter-spacing:.1em}
.toc li.on{color:var(--ink)}
.toc li.on span{color:var(--tld)}

/* chrome */
.bars{position:absolute;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:3px}
.bars i{flex:1;height:2.5px;border-radius:3px;background:rgba(255,255,255,.3);box-shadow:0 0 3px rgba(0,0,0,.35);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff;transition:width .4s var(--ease)}
.bars i.done b,.bars i.now b{width:100%}
.bars i.gap{margin-left:6px}
.top{position:absolute;z-index:10;top:calc(20px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}

    sc.innerHTML=`<div class="frames">${st.seq.map((f,j)=>`<div class="frame" data-j="${j}" style="${f.wa?'height:100%':''}">${f.wa?wa:`<img src="img/s-${f.img}.jpg" alt="">`}</div>`).join('')}</div><div class="spot"></div><div class="notes"></div><div class="copy"></div><div class="cap" hidden></div><div class="introdim"><h2>${ww(st.t,.15,.06)}</h2><p class="rise" style="animation-delay:.6s">${st.p}</p><div class="play rise" style="animation-delay:.9s">▶ Mirá cómo funciona</div></div><button class="replay" type="button">↺ Ver de nuevo</button>`;
    sc.querySelector('.introdim').classList.add('show');
    sc.dataset.img=st.seq[0].img||'';
  } else {
    sc.innerHTML=`<div class="shot"><img src="img/${st.img}.jpg" alt=""></div><div class="spot"></div><div class="botscrim"></div><div class="notes"></div><div class="copy"></div>`;
    sc.dataset.img=st.img;
  }
  return sc;
}
/* 1) mueve la cámara con la pantalla limpia  2) oscurece alrededor  3) texto y flechas */
function stage(sc,st,instant){
  const g=geo(st), shot=sc.querySelector('.shot'), spot=sc.querySelector('.spot'), copy=sc.querySelector('.copy'), notes=sc.querySelector('.notes');
  sc.classList.remove('focus','full');
  copy.classList.add('leave');notes.classList.add('leave');
  sc.querySelectorAll('.fx').forEach(e=>e.remove());
  if(instant){shot.style.transition='none';spot.style.transition='none'}
  shot.style.transform=`translateY(${-g.scroll}px)`;
  const pad=6*g.k;
  if(g.sp)Object.assign(spot.style,{left:`${10*g.k}px`,width:`${370*g.k}px`,top:`${g.sp.top-pad}px`,height:`${g.sp.h+pad*2}px`,borderRadius:'16px'});
  if(instant){shot.offsetHeight;shot.style.transition='';spot.style.transition=''}
  const settle=instant?850:1150;
  later(()=>{
    copy.classList.remove('leave');notes.classList.remove('leave');
    copy.classList.remove('show');notes.classList.remove('show');
    copy.innerHTML=desk()?'':copyHTML(st);
    let textTop=null,textBottom=null,noteSide='above',noteRef=0;
    const H=g.H;
    // efectos
    if(st.fx==='url'){
      const top=66;
      sc.insertAdjacentHTML('beforeend',`<div class="fx browser" style="top:${top}px"><span class="lk">✓</span><span class="typed"></span><span class="caret"></span></div>`);
      Object.assign(spot.style,{left:'12px',width:`${g.W-24}px`,top:`${top}px`,height:'46px',borderRadius:'16px'});
      typeUrl(sc.querySelector('.typed'));
      textTop=top+46+28;
    } else if(st.fx==='ring'){
      const cx=195*g.k, cy=285*g.k-g.scroll, r=62*g.k;
      Object.assign(spot.style,{left:`${cx-r}px`,width:`${2*r}px`,top:`${cy-r}px`,height:`${2*r}px`,borderRadius:'50%'});
      sc.insertAdjacentHTML('beforeend',`<div class="fx ring" style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px"></div>`);
      textBottom=null;textTop=TOPBAR()+14;
    } else if(st.fx==='push'){
      Object.assign(spot.style,{left:'0',width:'0',top:'0',height:'0'});
      const t=H*.5;
      sc.insertAdjacentHTML('beforeend',`<div class="fx push" style="top:${t}px;animation-delay:.2s"><img src="img/tlr-oscuro.png" alt=""><div><b>Nueva reserva 🎉</b><br>${BIZ.push1}</div><span class="when">ahora</span></div>${BIZ.push2?`<div class="fx push" style="top:${t+96}px;animation-delay:1.1s"><img src="img/tlr-oscuro.png" alt=""><div><b>Nueva compra en tu tienda 🛍️</b><br><small>${BIZ.push2}</small></div><span class="when">ahora</span></div>`:''}`);
      textTop=TOPBAR()+14;
    } else if(st.fx==='full'){
      sc.classList.add('full');Object.assign(spot.style,{left:'0',width:'0',top:'0',height:'0'});
      textBottom=BOT()+10;
    } else if(g.sp){
      const freeTop=g.sp.top-pad-TOPBAR(), freeBot=H-(g.sp.bot+pad)-BOT();
      if(freeTop>=freeBot){textTop=TOPBAR()+14;noteSide='above';noteRef=g.sp.top-pad}
      else{noteSide='below';noteRef=g.sp.bot+pad}
    }
    // flechas
    let notesH=0, svg='', lbls='';
    if(st.n&&g.sp){
      const n=st.n.length;
      st.n.forEach(([x,y,txt],j)=>{
        const px=x*g.k, py=y*g.k-g.scroll;
        const est=txt.length*7.4+24, row=n===2&&st.n.reduce((a,q)=>a+q[2].length*7.4+24,0)+40<=g.W;
        const ly=row?(noteSide==='above'?noteRef-62:noteRef+22):(noteSide==='above'?noteRef-22-(n-j)*40:noteRef+22+j*40);
        let lx=row?(j===0?14:g.W-14-est):Math.max(14,Math.min(g.W-14-est,px-est/2));
        const ax=Math.max(lx+14,Math.min(lx+est-14,px)), ay=noteSide==='above'?ly+30:ly;
        const my=(ay+py)/2, len=Math.hypot(px-ax,py-ay)*1.3+20;
        svg+=`<path d="M${ax} ${ay} C ${ax} ${my}, ${px} ${my}, ${px} ${py}" style="--len:${len};animation-delay:${.35+j*.25}s"/><circle cx="${px}" cy="${py}" r="5" style="animation-delay:${.75+j*.25}s"/>`;
        lbls+=`<div class="lbl" style="left:${lx}px;top:${ly}px;animation-delay:${.15+j*.25}s">${txt}</div>`;
      });
      notesH=(n===2&&st.n.reduce((a,q)=>a+q[2].length*7.4+24,0)+40<=g.W?1:n)*40+22;
      notes.innerHTML=`<svg aria-hidden="true">${svg}</svg>${lbls}`;
    } else notes.innerHTML='';
    if(st.tap&&g.sp)notes.insertAdjacentHTML('beforeend',`<div class="tap" style="left:${st.tap[0]*g.k}px;top:${st.tap[1]*g.k-g.scroll}px"></div>`);
    if(!desk()){
      if(textTop!==null){copy.style.top=textTop+'px';copy.style.bottom='auto'}
      else if(g.sp&&noteSide==='below'){copy.style.top=(g.sp.bot+pad+24+(st.n?notesH:0))+'px';copy.style.bottom='auto'}
      else {copy.style.top='auto';copy.style.bottom=(textBottom||BOT()+10)+'px'}
    }
    sc.classList.add('focus');
    later(()=>{copy.classList.add('show');notes.classList.add('show')},250);
  },settle);
}
function playSeq(sc,st){
  const W=scr.clientWidth,k=W/390,frames=[...sc.querySelectorAll('.frame')],cap=sc.querySelector('.cap'),intro=sc.querySelector('.introdim');
  const spot=sc.querySelector('.spot'),copy=sc.querySelector('.copy');
  sc.classList.remove('focus','done');copy.innerHTML='';spot.style.cssText='';
  frames.forEach(f=>f.classList.remove('on'));frames[0].classList.add('on');
  intro.classList.remove('off');cap.hidden=true;
  sc.querySelector('.replay').onclick=e=>{e.stopPropagation();clearLater();playSeq(sc,st)};
  let t=desk()?900:2300;
  later(()=>{intro.classList.add('off');cap.hidden=false},t);
  st.seq.forEach((f,j)=>{
    later(()=>{frames.forEach((x,m)=>x.classList.toggle('on',m===j));cap.innerHTML=`<b>${j+1}/${st.seq.length}</b><span>${f.cap}</span>`},t);
    t+=f.wa?2600:1000;
    if(f.tap){const [x,y]=f.tap;later(()=>{const d=document.createElement('div');d.className='press';d.style.left=x*k+'px';d.style.top=y*k+'px';sc.appendChild(d);setTimeout(()=>d.remove(),900)},t);t+=650}
    else if(j<st.seq.length-1)t+=300;
  });
  later(()=>{
    const e=st.end,pad=6*k;
    Object.assign(spot.style,{left:`${10*k}px`,width:`${370*k}px`,top:`${e.spot[0]*k-pad}px`,height:`${e.spot[1]*k+pad*2}px`,borderRadius:'16px'});
    if(!desk()){copy.innerHTML=copyHTML({c:st.c,t:e.t,p:e.p});const top=e.spot[0]*k-pad, bot=(e.spot[0]+e.spot[1])*k+pad;
      if(top-66>scr.clientHeight-bot-80){copy.style.top='80px';copy.style.bottom='auto'}else{copy.style.top=(bot+24)+'px';copy.style.bottom='auto'}}
    sc.classList.add('focus','done');later(()=>copy.classList.add('show'),250);
  },t+600);
}
function playVid(sc,st){
  const W=scr.clientWidth,k=W/390,v=sc.querySelector('video'),cap=sc.querySelector('.cap'),intro=sc.querySelector('.introdim'),spot=sc.querySelector('.spot'),copy=sc.querySelector('.copy'),wo=sc.querySelector('.waover');
  sc.classList.remove('focus','done','ended');copy.innerHTML='';spot.style.cssText='';if(wo)wo.classList.remove('on');
  intro.classList.remove('off');cap.hidden=true;v.pause();try{v.currentTime=0}catch(e){}
  sc.querySelector('.replay').onclick=e=>{e.stopPropagation();clearLater();playVid(sc,st)};
  let last=-1;
  const setCap=(n,txt)=>{cap.innerHTML=`<b>${n}/${st.caps.length+(wo?1:0)}</b><span>${txt}</span>`};
  v.ontimeupdate=()=>{let j=-1;st.caps.forEach((c,m)=>{if(v.currentTime>=c[0])j=m});if(j!==last&&j>=0){last=j;setCap(j+1,st.caps[j][1])}};
  const finish=()=>{if(!desk()){sc.classList.add('ended');later(finish2,850)}else finish2()};
  const finish2=()=>{
    const e=st.end;
    if(e.spot){const vr=sc.querySelector('.vidwrap').getBoundingClientRect(),r0=scr.getBoundingClientRect(),kk=vr.width/390,ox=vr.left-r0.left,oy=vr.top-r0.top,pad=5*kk;Object.assign(spot.style,{left:`${ox+10*kk}px`,width:`${370*kk}px`,top:`${oy+e.spot[0]*kk-pad}px`,height:`${e.spot[1]*kk+pad*2}px`,borderRadius:'14px'})}
    else{const m=sc.querySelector('.waover .msg').getBoundingClientRect(),r=scr.getBoundingClientRect();Object.assign(spot.style,{left:`${m.left-r.left-6}px`,width:`${m.width+12}px`,top:`${m.top-r.top-6}px`,height:`${m.height+12}px`,borderRadius:'14px'})}
    if(!desk()){copy.innerHTML=copyHTML({c:st.c,t:e.t,p:e.p});const fr=sc.querySelector('.vidwrap').getBoundingClientRect(),sr=spot.getBoundingClientRect(),r=scr.getBoundingClientRect();copy.style.top=(Math.max(fr.bottom,sr.bottom)-r.top+22)+'px';copy.style.bottom='auto'}
    sc.classList.add('focus','done');later(()=>copy.classList.add('show'),250);
    // al terminar el video: el botón dice "Seguir" y, si nadie toca, avanza solo
    $('#next').classList.add('cta');
    later(()=>{if(cur===sc)go(i+1)},st.autoNext?2800:6500);
  };
  v.onended=()=>{
    if(st.autoNext){later(()=>{if(cur===sc)go(i+1)},700);return}
    if(wo){later(()=>{wo.classList.add('on');setCap(st.caps.length+1,'El pedido te llega por WhatsApp')},300);later(finish,3200)}
    else later(finish,500);
  };
  later(()=>{intro.classList.add('off');cap.hidden=false;const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{v.muted=true;v.play().catch(()=>{})})},desk()?900:2300);
}
function playTheme(sc,st){
  const imgs=[...sc.querySelectorAll('.pg img')],copy=sc.querySelector('.copy'),sw=[...sc.querySelectorAll('.sw button')],md=sc.querySelector('.md');
  let c=TH.colors[0],mode='light',front=0,auto=true;
  const show=()=>{const nx=1-front;imgs[nx].onload=()=>{imgs[nx].style.opacity=1;imgs[front].style.opacity=0;front=nx};imgs[nx].src=`img/th-${mode}-${c.slice(1)}.jpg`;
    sw.forEach(b=>b.classList.toggle('on',b.dataset.c===c));md.classList.toggle('on',mode==='dark');md.textContent=mode==='dark'?'☀️ Claro':'🌙 Oscuro'};
  imgs[0].src=`img/th-light-${c.slice(1)}.jpg`;imgs[0].style.opacity=1;imgs[1].style.opacity=0;show();
  const stop=()=>{auto=false};
  sw.forEach(b=>b.onclick=e=>{e.stopPropagation();stop();c=b.dataset.c;show()});
  md.onclick=e=>{e.stopPropagation();stop();mode=mode==='dark'?'light':'dark';show()};
  sc.querySelector('.picker').addEventListener('touchend',e=>e.stopPropagation());
  copy.innerHTML=desk()?'':copyHTML(st);if(!desk()){copy.style.top=(TOPBAR()+14)+'px';copy.style.bottom='auto'}
  later(()=>{sc.classList.add('focus');later(()=>copy.classList.add('show'),250)},700);
  const seq=[[1,'light'],[2,'light'],[2,'dark'],[3,'dark'],[4,'dark'],[0,'light']];let n=0;
  const tick=()=>{if(!auto||!sc.isConnected)return;const [ci,m]=seq[n++%seq.length];c=TH.colors[ci];mode=m;show();later(tick,1500)};
  later(tick,2200);
}
function fitUrl(el){const b=el.closest('.browser');if(!b)return;let f=parseFloat(getComputedStyle(b).fontSize);while(el.scrollWidth>el.clientWidth+1&&f>10){f-=.5;b.style.fontSize=f+'px'}}
function typeUrl(el){const sub=BIZ.sub,rest='.turnitoslr.com';let n=0,iv;
  setTimeout(()=>{iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);n++;
    el.innerHTML=n<=sub.length?`<b>${sub.slice(0,n)}</b>`:`<b>${sub}</b>${rest.slice(0,n-sub.length)}`;fitUrl(el);if(n>=sub.length+rest.length)clearInterval(iv)},55)},400)}
function sideCopy(st){const el=$('#copySide');el.classList.add('leave');setTimeout(()=>{el.classList.remove('leave','show');el.innerHTML=st.type?`<ol class="toc">${Object.keys(CH).map((k,n)=>`<li class="${!st.c||st.c===k?'on':''}"><span>0${n+1}</span>${CH[k].t.replace(/<\/?em>/g,'')}</li>`).join('')}</ol>`:copyHTML(st);setTimeout(()=>el.classList.add('show'),st.type?100:1300)},280)}
function go(n,origin){
  n=Math.max(0,Math.min(S.length-1,n));if(n===i)return;
  clearLater();
  const dir=n>i?1:-1, st=S[n], prevSt=S[i];i=n;
  $('#next').classList.remove('cta');
  if(st.fx!=='notif'&&musCut){musCut=false;if(musOn){musStarted=false;musStart()}}
  bars();$('#device').classList.toggle('lt',st.type==='intro'||st.type==='chapter');$('#prev').disabled=i===0;$('#hint').style.visibility=i<3?'visible':'hidden';
  sideCopy(st);
  if(cur&&!st.type&&st.img&&prevSt&&!prevSt.type&&prevSt.img===st.img){stage(cur,st,false);return}
  const sc=build(st);
  if(st.type){
    sc.style.setProperty('--cx',origin?origin[0]+'px':'50%');sc.style.setProperty('--cy',origin?origin[1]+'px':'60%');
    sc.classList.add('in-cover');scr.appendChild(sc);
  } else {
    scr.appendChild(sc);if(st.fx==='notif')playNotif(sc,st);else if(st.vid)playVid(sc,st);else if(st.fx==='theme')playTheme(sc,st);else if(st.seq)playSeq(sc,st);else stage(sc,st,true);
    sc.classList.add(dir>0?'in-next':'in-prev');
    if(cur)cur.classList.add(dir>0?'out-next':'out-prev');
  }
  const old=cur;cur=sc;
  if(old)setTimeout(()=>old.remove(),850);
  try{history.replaceState(null,'','#paso-'+(i+1))}catch(e){}
}

/* Pantalla bloqueada: corta la música, suena la notificación, vibra el celu y abre el panel solo */
let musCut=false;
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=chime.ac||(chime.ac=new A());if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime+.02;[[1046.5,0],[1568,.13],[2093,.26]].forEach(([f,d],j)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(j===2?.22:.28,t+d+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d+(j===2?.9:.45));o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+1)})}catch(e){}}
function playNotif(sc,st){
  if(musOn&&musStarted&&!MUS.paused){musCut=true;fadeTo(0,280)}
  const dev=$('#device');
  later(()=>{sc.classList.add('nt-on');chime();dev.classList.remove('buzz');void dev.offsetWidth;dev.classList.add('buzz')},750);
  if(st.auto!==false){
    later(()=>{const n=sc.querySelector('.notif').getBoundingClientRect(),r=sc.getBoundingClientRect(),dot=sc.querySelector('.tapdot');
      dot.style.left=(n.left-r.left+n.width*.5)+'px';dot.style.top=(n.top-r.top+n.height*.5)+'px';sc.classList.add('nt-tap')},2900);
    later(()=>{const n=sc.querySelector('.notif'),r=sc.getBoundingClientRect(),q=n.getBoundingClientRect(),app=document.createElement('div');
      app.className='lk-app';Object.assign(app.style,{left:(q.left-r.left)+'px',top:(q.top-r.top)+'px',width:q.width+'px',height:q.height+'px'});sc.appendChild(app);
      sc.classList.add('nt-open');requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(app.style,{left:'0px',top:'0px',width:r.width+'px',height:r.height+'px',borderRadius:'0px'})))},3250);
    later(()=>go(i+1),3950);
  }
}
function bars(){$('#bars').innerHTML=S.map((s,j)=>`<i class="${j<i?'done':j===i?'now':''}${s.type==='chapter'?' gap':''}"><b></b></i>`).join('')}
$('#next').onclick=e=>{e.stopPropagation();i===S.length-1?go(0):go(i+1)};
$('#prev').onclick=e=>{e.stopPropagation();go(i-1)};
const dev=$('#device');let x0=null,y0=null;
dev.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
dev.addEventListener('touchend',e=>{if(x0===null||e.target.closest('button'))return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0,r=dev.getBoundingClientRect();
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));
  else if(Math.abs(dx)<12&&Math.abs(dy)<12)go(i+((x0-r.left)<r.width*.28?-1:1),[x0-r.left,y0-r.top]);x0=null},{passive:true});
dev.addEventListener('click',e=>{if(!matchMedia('(hover:hover)').matches||e.target.closest('button'))return;const r=dev.getBoundingClientRect();go(i+((e.clientX-r.left)<r.width*.28?-1:1),[e.clientX-r.left,e.clientY-r.top])});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft')go(i-1);if(e.key==='Escape')$('#index').hidden=true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur&&!S[i].type&&S[i].img){clearLater();stage(cur,S[i],true)}},150)});
$('#openIndex').onclick=e=>{e.stopPropagation();let h='<button class="close" type="button" id="closeIdx">Cerrar</button>',n=0;
  S.forEach((s,j)=>{if(s.type==='chapter')h+=`<h3>${CH[s.c].n} · ${CH[s.c].t.replace(/<\/?em>/g,'')}</h3>`;if(!s.type){n++;h+=`<button class="item" type="button" data-j="${j}"><span>${String(n).padStart(2,'0')}</span>${s.t.replace(/<\/?em>/g,'')}</button>`}});
  const ix=$('#index');ix.innerHTML=h;ix.hidden=false;$('#closeIdx').onclick=()=>ix.hidden=true;
  ix.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ix.hidden=true;go(+b.dataset.j)})};
[...new Set(S.flatMap(s=>s.seq?s.seq.filter(f=>f.img).map(f=>'s-'+f.img):[s.img]).filter(Boolean))].forEach(k=>{const im=new Image();im.src='img/'+k+'.jpg'});
/* música: arranca suave con el primer toque (el navegador no deja antes) */
const MUS=$('#music');let musOn=true,musStarted=false,fadeIv;
try{if(localStorage.getItem('tour-music')==='off')musOn=false}catch(e){}
function fadeTo(v,ms=1800){clearInterval(fadeIv);const v0=MUS.volume,t0=performance.now();fadeIv=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);MUS.volume=v0+(v-v0)*k;if(k>=1){clearInterval(fadeIv);if(v===0)MUS.pause()}},50)}
function musStart(){if(!musOn||(musStarted&&!MUS.paused))return;musStarted=true;MUS.volume=0;const p=MUS.play();if(p&&p.then)p.then(()=>fadeTo(.38,500)).catch(()=>{musStarted=false})}
musStart();
function musUI(){$('#snd').classList.toggle('muted',!musOn)}
$('#snd').onclick=e=>{e.stopPropagation();musOn=!musOn;try{localStorage.setItem('tour-music',musOn?'on':'off')}catch(_){}musUI();if(musOn){musStarted=false;musStart()}else fadeTo(0,600)};
['pointerdown','mousedown','click','keydown','touchstart','touchend'].forEach(ev=>addEventListener(ev,()=>{if(musOn&&!musCut&&MUS.paused)musStarted=false;musStart()},{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)MUS.pause();else if(musOn&&musStarted)MUS.play().catch(()=>{})});
musUI();
const fromHash=()=>{const m=/paso-(\d+)/.exec(location.hash);return m?Math.min(S.length,+m[1])-1:0};
addEventListener('hashchange',()=>{const n=fromHash();if(n!==i)go(n)});
go(fromHash());
