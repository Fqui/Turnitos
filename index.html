<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // iPhone/iPad: Safari agranda la página al tocar un campo y no vuelve. Con maximum-scale=1
    // deja de hacer ese zoom automático, pero se puede seguir haciendo zoom con los dedos.
    (function () {
      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1');
    })();
  </script>
  <meta name="theme-color" content="#00E676" />

  <!-- Business pages and static pages get this block replaced on the server (api/page.js) -->
  <!-- seo:start -->
  <title>TurnitosLR | Reserva de Turnos Online en La Rioja</title>
  <meta name="description" content="Reservá canchas de pádel y fútbol, turnos de peluquería, barbería, estética y quinchos en La Rioja. Horarios en tiempo real, sin llamar." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.turnitoslr.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TurnitosLR" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:url" content="https://www.turnitoslr.com/" />
  <meta property="og:title" content="TurnitosLR | Reserva de Turnos Online en La Rioja" />
  <meta property="og:description" content="Reservá canchas de pádel y fútbol, turnos de peluquería, barbería, estética y quinchos en La Rioja. Horarios en tiempo real, sin llamar." />
  <meta property="og:image" content="https://www.turnitoslr.com/og-turnitos.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TurnitosLR | Reserva de Turnos Online en La Rioja" />
  <meta name="twitter:description" content="Reservá canchas de pádel y fútbol, turnos de peluquería, barbería, estética y quinchos en La Rioja. Horarios en tiempo real, sin llamar." />
  <meta name="twitter:image" content="https://www.turnitoslr.com/og-turnitos.jpg" />
  <!-- seo:end -->

  <!-- Local Geo-SEO (La Rioja, Argentina) -->
  <meta name="geo.region" content="AR-F" />
  <meta name="geo.placename" content="La Rioja" />
  <meta name="geo.position" content="-29.4131;-66.8558" />
  <meta name="ICBM" content="-29.4131, -66.8558" />
  <!-- Short splash only for the installed app (standalone); ?splash=1 forces it for testing -->
  <script>
    (function () {
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone || /[?&]splash=1/.test(location.search)) document.documentElement.classList.add('show-splash');
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('splash-dark'); } catch (e) {}
    })();
  </script>
  <style>
    #pwa-splash { display: none; }
    .show-splash #pwa-splash {
      display: flex; position: fixed; inset: 0; z-index: 99999;
      align-items: center; justify-content: center; background: #ffffff;
      transition: opacity 0.25s ease;
      /* Safety net: hides itself even if the app never signals it */
      animation: pwaSplashOut 0.25s ease 0.9s forwards;
    }
    .splash-dark #pwa-splash { background: #121212; }
    #pwa-splash img { width: 96px; height: 96px; border-radius: 22px; animation: pwaSplashIn 0.35s ease both; }
    #pwa-splash.is-hidden { opacity: 0; pointer-events: none; }
    @keyframes pwaSplashIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes pwaSplashOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>

<body>
  <div id="pwa-splash" aria-hidden="true"><img src="/logo-turnitos.png" alt="" /></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
